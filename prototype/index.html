<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#350b19">
<title>Академия вкуса — прототип</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#350b19; --panel:#471223; --deep:#280711; --gold:#f4cf72; --white:#fff; --soft:#eee4e8; --line:#6a3445;
  --ok:#7fcf94; --warn:#f0b35a; --bad:#ff8c98;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:Manrope,Arial,sans-serif;font-size:14px;line-height:1.6;color:var(--white);background:#1d0510;padding-top:44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold)}
h1,h2,h3{font-family:Prata,Georgia,serif;font-weight:400}
.hide{display:none!important}
.soft{color:var(--soft)}
.gold{color:var(--gold)}
.small{font-size:12px}
.eyebrow{color:var(--gold);font-size:11px;line-height:1.6;letter-spacing:.12em;text-transform:uppercase}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* demo bar */
#demo{position:fixed;top:0;left:0;right:0;z-index:70;height:44px;display:flex;gap:10px;align-items:center;padding:0 12px;background:#14030a;border-bottom:1px solid var(--line);font-size:12px}
#demo b{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;white-space:nowrap}
#demo select{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;flex:1;max-width:320px;min-width:0}

/* кнопки */
.primary{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:54px;padding:15px 20px;border:0;border-radius:12px;background:var(--gold);color:var(--deep);text-decoration:none;font:700 14px/1.6 Manrope,Arial,sans-serif;text-align:left}
.primary.center{justify-content:center}
.primary.sm{min-height:44px;padding:10px 16px;width:auto;font-size:13px}
.primary[disabled]{opacity:.5;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border:1px solid var(--line);border-radius:12px;color:var(--white);font:600 13px/1.6 Manrope;background:transparent}
.ghost.sm{min-height:40px;width:auto;padding:8px 14px;font-size:12px}
.danger{background:#a8323f!important;color:#fff!important}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--gold)}
.badge.live{border-color:var(--bad);color:var(--bad)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* поля */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;color:var(--white)}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-height:48px;outline:none;color:var(--white);font-size:15px}
.in:focus{border-color:var(--gold)}
.in::placeholder{color:#b9a3ab}
textarea.in{min-height:96px;resize:vertical}
select.in option{color:#222}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.6;margin-bottom:12px;cursor:pointer;color:var(--soft)}
.chk input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:none}
.sw{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line);flex:none;transition:.2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}
.sw.on::after{left:23px;background:var(--deep)}

/* карточки */
.paper{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--white);position:relative}
.paper .muted,.muted{color:var(--soft)}
.dark{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--soft)}
.banner{border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:12.5px;background:rgba(240,179,90,.1);margin:6px 0 12px}

/* ============ ЛЕНДИНГ (стиль клиента) ============ */
.col{width:100%;max-width:440px;margin:0 auto;background:var(--bg);min-height:calc(100vh - 44px);position:relative}
.kn-top{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:21px 24px;background:var(--bg)}
.kn-author{font:500 12px/1.6 Manrope;letter-spacing:.02em}
.kn-author span{display:block;color:var(--gold);font-size:11px;letter-spacing:.13em;text-transform:uppercase}
.kn-login-link{color:var(--white);font-size:12px;text-decoration:none;padding:11px 17px;border:1px solid var(--line);border-radius:24px;display:inline-flex;align-items:center;gap:8px;min-height:44px;white-space:nowrap}
.kn-login-link svg{width:14px;height:14px}
.kn-hero{position:relative;isolation:isolate;min-height:650px;display:flex;align-items:flex-end;background:var(--bg)}
.kn-hero-photo{position:absolute;top:0;left:0;width:100%;height:auto;z-index:-3}
.kn-hero::before{content:'';position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,transparent 0%,transparent 31%,#350b1933 45%,#350b19d9 69%,var(--bg) 99%)}
.kn-hero-content{padding:230px 26px 28px;width:100%}
.kn-hero .eyebrow{margin:0 0 15px}
.kn-h1{font:400 53px/1.15 Prata,Georgia,serif;letter-spacing:-.035em;margin:0 0 16px}
.kn-h1 span{display:block;color:var(--gold);background:linear-gradient(120deg,#ffe9aa,#f4cf72 48%,#e6b94b);background-clip:text;-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.kn-lead{font:400 14px/1.7 Manrope;margin:0 0 20px;max-width:335px}
.kn-text-link{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:13px 0 0;font-size:12px;text-decoration:none;color:var(--white)}
.kn-text-link svg{width:14px;height:14px}
.kn-section{padding:34px 26px;border-top:1px solid var(--line)}
.kn-section.raised{background:var(--panel)}
.kn-section h2{font:400 28px/1.35 Prata,Georgia,serif;letter-spacing:-.025em;margin:0 0 22px}
.kn-section h2 span{color:var(--gold)}
.kn-section .eyebrow{margin-bottom:12px}
.kn-section p{font-size:13px;line-height:1.85;color:var(--soft);margin:0 0 18px}
.kn-benefits{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kn-benefit{padding:19px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.kn-benefit svg{color:var(--gold);width:22px;height:22px;margin-bottom:12px}
.kn-benefit h3{font:600 13px/1.55 Manrope;margin:0 0 7px}
.kn-benefit p{font-size:11px;line-height:1.8;margin:0}
.kn-note{display:flex;gap:10px;padding-top:19px;margin:0!important;color:var(--white)!important;font-size:12px!important}
.kn-note svg{color:var(--gold);width:18px;height:18px;flex:none;margin-top:3px}
.kn-about-head{display:flex;gap:16px;align-items:center;margin-bottom:18px}
.kn-about-photo{width:69px;height:84px;object-fit:cover;object-position:25% 2%;border-radius:10px;flex:none}
.kn-about-head h2{font-size:22px;margin:0 0 5px}
.kn-about-head p{font-size:11px;line-height:1.6;margin:0;color:var(--gold)}
.kn-examples{display:grid;gap:12px}
.kn-example{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:20px}
.kn-fmt{color:var(--gold);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:13px}
.kn-fmt svg{width:16px;height:16px}
.kn-example h3{font:400 22px/1.45 Prata,Georgia,serif;margin:0 0 9px}
.kn-example p{font-size:12px;line-height:1.8;margin:0}
.kn-week{display:grid;gap:8px}
.kn-wd{display:flex;gap:14px;align-items:center;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.kn-wd b{font:400 15px Prata,serif;color:var(--gold);min-width:30px}
.kn-wd span{font-size:12.5px;line-height:1.5}
.kn-wd em{font-style:normal;display:block;font-size:11px;color:var(--soft)}
.kn-steps{list-style:none;margin:0;padding:0;display:grid;gap:22px}
.kn-steps li{display:flex;gap:16px;align-items:flex-start}
.kn-no{font:400 28px/1.3 Prata,Georgia,serif;color:var(--gold);min-width:39px}
.kn-steps b{font-size:13px;font-weight:600;line-height:1.65}
.kn-steps p{font-size:12px;line-height:1.8;margin:6px 0 0}
.kn-tariff{padding:25px 21px;background:var(--bg);border:1px solid var(--gold);border-radius:17px}
.kn-tariff-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.kn-tariff-top b{color:var(--gold);font:500 11px/1.6 Manrope;letter-spacing:.1em;text-transform:uppercase}
.kn-tariff-top svg{color:var(--gold);width:19px;height:19px}
.kn-periods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.kn-periods button{padding:10px 4px;border:1px solid var(--line);border-radius:10px;font-size:12px;line-height:1.3;color:var(--soft);text-align:center}
.kn-periods button.on{border-color:var(--gold);color:var(--gold);background:rgba(244,207,114,.08)}
.kn-price{font:400 40px/1.2 Prata,Georgia,serif;margin:0 0 6px}
.kn-pnote{font-size:11px!important;line-height:1.7!important;margin:0 0 22px!important}
.kn-list{list-style:none;padding:0;margin:0 0 23px;display:grid;gap:13px}
.kn-list li{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.65}
.kn-list svg{color:var(--gold);width:16px;height:16px;flex:none;margin-top:2px}
.kn-renewal{padding-top:22px}
.kn-renewal h3{color:var(--gold);font:500 13px/1.7 Manrope;margin:0 0 8px}
.kn-renewal p{font-size:11px;line-height:1.85;margin:0}
.kn-faq details{border-top:1px solid var(--line)}
.kn-faq summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:18px 0;min-height:54px;font:500 13px/1.8 Manrope;cursor:pointer}
.kn-faq summary::-webkit-details-marker{display:none}
.kn-faq summary::after{content:'+';color:var(--gold);font-size:22px;line-height:1;flex:none}
.kn-faq details[open] summary::after{content:'−'}
.kn-faq details p{font-size:12px;line-height:1.9;margin:0 0 20px}
.kn-support{display:flex;align-items:flex-start;gap:15px}
.kn-support>svg{width:24px;height:24px;color:var(--gold);flex:none;margin-top:3px}
.kn-support h2{font-size:24px;margin-bottom:11px}
.kn-support p{font-size:12px;line-height:1.8;margin-bottom:0}
.kn-contact{display:block;font:500 12px/1.7 Manrope;color:var(--gold);margin-top:12px}
.kn-footer{padding:26px;background:var(--deep);border-top:1px solid var(--line)}
.kn-footer-name{font:400 23px/1.5 Prata,serif;margin-bottom:7px}
.kn-footer-by{font-size:11px;color:var(--soft);margin-bottom:22px}
.kn-docs{display:flex;flex-wrap:wrap;gap:4px 18px}
.kn-doc{font:400 11px/1.7 Manrope;color:var(--soft);text-decoration:underline;text-underline-offset:4px;text-align:left;padding:10px 0;min-height:44px}
.kn-fnote{font-size:11px;line-height:1.8;color:var(--soft);margin:15px 0 0}
.agebar{margin:0 24px 6px;padding:11px 14px;border:1px solid var(--warn);border-radius:12px;background:rgba(240,179,90,.1);font-size:12.5px;text-align:center}

/* ============ ПРИЛОЖЕНИЕ ============ */
.app{padding:0 20px 110px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 0 6px}
.brand{font:400 31px/1.2 Prata,serif;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.by{font-size:12px;color:var(--soft);margin-top:2px}
.hbtns{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);background:rgba(71,18,35,.5);position:relative}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hello{font-size:12.5px;color:var(--soft);margin:8px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;height:128px;border-radius:16px;overflow:hidden;border:1px solid var(--line);text-align:left;background-color:var(--panel);background-repeat:no-repeat}
.tile::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(53,11,25,.25),rgba(40,7,17,.9))}
.tile .ic{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:9px;background:rgba(40,7,17,.75);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.tile .ic svg{width:17px;height:17px}
.tile b{position:absolute;left:11px;right:8px;bottom:10px;font:600 13px/1.3 Manrope}
.search{display:flex;align-items:center;gap:10px;margin:20px 0 6px;padding:0 16px;min-height:52px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--gold)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--white);font-size:14px;min-width:0}
.search input::placeholder{color:#b9a3ab}
.sech{display:flex;justify-content:space-between;align-items:center;margin:30px 0 4px}
.sech h2{font-size:26px;letter-spacing:-.02em}
.sech .more{color:var(--gold);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sech .more svg{width:15px;height:15px}
.arrows{display:flex;gap:14px;color:var(--gold)}
.sub{font-size:12px;color:var(--soft);margin-bottom:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.days button.on{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:700}
.days button i{width:4px;height:4px;border-radius:50%;background:transparent;display:block}
.days button.has i{background:var(--gold)}
.days button.on.has i{background:var(--deep)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:10px}
.item b{font:600 14px/1.5 Manrope;display:block}
.item span.s{font-size:12px;color:var(--soft);display:block}
.item .go{color:var(--gold)}
.item.nolink{opacity:.85;cursor:default}
.item .tm{font:400 17px Prata,serif;color:var(--gold);min-width:50px}
.feature{position:relative;min-height:330px;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;text-align:left;width:100%;background:var(--panel) url(img/hero.jpg) no-repeat;background-size:230% auto;background-position:22% 6%}
.feature::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(53,11,25,.1) 0%,rgba(53,11,25,.55) 45%,rgba(40,7,17,.97) 100%)}
.feature .pill{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(40,7,17,.72);border:1px solid var(--line);font-size:12px;font-weight:500}
.feature .pill svg{width:15px;height:15px;color:var(--gold)}
.feature .in-f{position:relative;padding:22px 20px 20px;width:100%}
.feature h3{font:400 34px/1.15 Prata,serif;letter-spacing:-.02em;margin:8px 0 18px}
.feature .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft)}
.feature .meta b{color:var(--gold);display:inline-flex;gap:6px;align-items:center;font-size:13px}
.lcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);text-align:left}
.lcard .ph{height:128px;background-color:var(--deep);background-repeat:no-repeat;background-image:url(img/hero.jpg)}
.lcard .tx{padding:14px 14px 16px}
.lcard .tx small{display:block;font-size:11px;color:var(--soft);margin-bottom:6px}
.lcard .tx b{font:400 17px/1.35 Prata,serif}
.meet{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px}
.meet .eyebrow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.meet h3{font:400 27px/1.25 Prata,serif;margin-bottom:14px}
.meet p{font-size:12px;color:var(--soft);margin-bottom:16px}
.handy{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hbtn{display:flex;align-items:center;gap:12px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:13px;font-weight:500;text-align:left}
.hbtn svg{color:var(--gold)}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:440px;bottom:0;z-index:40;background:var(--deep);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:11px 2px 9px;font-size:10.5px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button.on{color:var(--gold)}
.back{color:var(--gold);padding:14px 0 4px;font-size:13px;font-weight:600}
.pagehead{font-size:30px;letter-spacing:-.02em;margin:20px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--soft)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:700}
.dayh{font:400 17px Prata,serif;margin:20px 0 10px;display:flex;gap:10px;align-items:center}
.dayh .today{font:700 10px Manrope;letter-spacing:.1em;background:var(--gold);color:var(--deep);padding:3px 9px;border-radius:999px}
.video{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,#5a1830,#1d0510);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.video .play{width:64px;height:64px;border-radius:50%;background:rgba(244,207,114,.15);border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.video .cap{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--soft)}
.prose p{margin-bottom:12px;font-size:13.5px;line-height:1.85;color:var(--soft)}
.heart{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:12.5px;font-weight:600}
.heart.on svg{fill:var(--gold)}
.tag{display:inline-block;font-size:11.5px;color:var(--gold);margin-right:8px}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px;padding:6px 0 10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;position:relative;font-size:13.5px}
.m .who{font-size:11.5px;color:var(--gold);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.m.me{align-self:flex-end;background:#6b1d3a}
.m .del{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#a8323f;font-size:12px;display:grid;place-items:center}
.m.gone{opacity:.5;font-style:italic}
.pin{font-size:12px;padding:10px 13px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);margin-bottom:8px}
.composer{position:sticky;bottom:64px;display:flex;gap:8px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.composer .in{border-radius:999px}
.composer .primary{width:auto;min-height:48px;border-radius:999px;padding:0 20px}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;border:1px solid var(--line);color:var(--gold);flex:none}
h2.sec{font-size:22px;margin:28px 0 12px}
.q{margin-bottom:18px}
.q h3{font:400 19px/1.35 Prata,serif;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--panel);font-size:13px}
.opt input{accent-color:var(--gold)}
.opt.on{border-color:var(--gold)}
.steps{display:grid;gap:14px}
.steps>div{display:flex;gap:14px}
.steps>div>b{font:400 24px Prata,serif;color:var(--gold);min-width:34px}

/* модальные окна */
#modal{position:fixed;inset:0;z-index:80;background:rgba(10,2,6,.78);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:24px 22px 30px;animation:up .25s ease}
@media(min-width:640px){#modal{align-items:center}#modal .box{border-radius:20px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal .x{float:right;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--white);background:var(--bg)}
#modal h2{font-size:25px;margin-bottom:8px;letter-spacing:-.02em;padding-right:50px}
#modal .muted{color:var(--soft);font-size:12.5px;line-height:1.8}
.topt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg);font-size:13px}
.topt.on{border-color:var(--gold)}
.topt input{accent-color:var(--gold)}
.stepdots{display:flex;gap:6px;margin:12px 0 16px}
.stepdots i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.stepdots i.on{background:var(--gold)}
.notif{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.notif:last-of-type{border-bottom:0}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;background:var(--deep);border:1px solid var(--gold);color:var(--white);padding:11px 18px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.on{opacity:1}
#age{position:fixed;inset:0;z-index:95;background:rgba(20,3,10,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;text-align:center}
#age .box{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:28px 22px;animation:up .25s ease}
#age h2{font-size:28px;margin:14px 0 10px;letter-spacing:-.02em}
#age .seal{width:72px;height:72px;margin:0 auto;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:400 26px Prata,serif;color:var(--gold)}
#age p{font-size:12.5px;color:var(--soft);margin-bottom:22px;line-height:1.8}

/* ============ АДМИНКА ============ */
.adm{max-width:1120px;margin:0 auto;padding:16px 14px 60px;display:grid;grid-template-columns:210px 1fr;gap:18px;background:var(--bg);min-height:calc(100vh - 44px)}
@media(max-width:820px){.adm{grid-template-columns:1fr}}
.side{position:sticky;top:56px;align-self:start;display:flex;flex-direction:column;gap:4px}
@media(max-width:820px){.side{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.side button{text-align:left;padding:10px 14px;border-radius:10px;color:var(--soft);white-space:nowrap;font-size:13px}
.side button.on{background:var(--gold);color:var(--deep);font-weight:700}
.side .who{font-size:12px;color:var(--soft);padding:6px 14px 12px}
.adm h1{font:400 30px Prata,serif;margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--soft);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:rgba(255,255,255,.04)}
.scroll{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
@media(max-width:620px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.kpi b{display:block;font:400 26px Prata,serif}
.kpi span{font-size:11.5px;color:var(--soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.drawer{position:fixed;top:44px;right:0;bottom:0;width:min(480px,100%);z-index:60;background:var(--deep);border-left:1px solid var(--line);overflow:auto;padding:20px;animation:up .2s}
.drawer h2{font:400 24px Prata,serif}
.denied{opacity:.4;pointer-events:none}
.mini{display:inline-flex;gap:4px}
.mini i{font-style:normal;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--soft)}
.mini i.on{border-color:var(--ok);color:var(--ok)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

function go(v,extra){S.view=v;if(extra)for(var k in extra)S[k]=extra[k];render();window.scrollTo(0,0)}
function tById(id){return TARIFFS.filter(function(t){return t.id===id})[0]}
function libById(id){return LIB.filter(function(x){return x.id===id})[0]}
function dayName(d){return DAYS.filter(function(x){return x[1]===d})[0][0]}

var LOCKED=['home','lib','item','events','event','chat','fav','start','taste','rules'];
function shell(){
 var v=S.view,body='';
 if(S.role==='expired'&&LOCKED.indexOf(v)>-1) body=paywall();
 else body=({home:home,lib:libView,item:itemView,events:eventsView,event:eventView,chat:chatView,profile:profileView,fav:favView,support:supportView,ticket:ticketView,start:startView,taste:tasteView,rules:rulesView}[v]||home)();
 var tabs=[['home','home','Главная'],['lib','book','Библиотека'],['events','cal','События'],['chat','chat','Чат'],['profile','user','Профиль']];
 var cur=({item:'lib',event:'events',fav:'profile',support:'profile',ticket:'profile',start:'home',taste:'home',rules:'home'})[v]||v;
 return '<div class="col"><div class="app">'+body+'</div><nav class="nav">'+tabs.map(function(t){return '<button class="'+(cur===t[0]?'on':'')+'" data-act="go" data-v="'+t[0]+'">'+ic(t[1],22)+t[2]+'</button>'}).join('')+'</nav></div>';
}
function hdr(){
 return '<div class="hdr"><div><div class="brand">Академия <span>вкуса</span></div><div class="by">Кристина Никитичева</div></div><div class="hbtns">'+
 '<button class="iconbtn" data-act="bell" aria-label="Уведомления">'+ic('bell')+'<span class="dot"></span></button><button class="iconbtn" data-act="go" data-v="profile" aria-label="Профиль">'+ic('user')+'</button></div></div>';
}
function paywall(){

 '<p class="muted">Эфиры, библиотека и чат доступны только участникам. Профиль и история платежей остаются с вами.</p>'+
 '<button class="primary center" data-act="renew">Возобновить подписку</button><button class="ghost" data-act="go" data-v="profile">Открыть профиль</button></div>';

}

 return hdr()+'<h1 class="pagehead">Библиотека</h1><div class="search" style="margin-top:0">'+ic('search')+'<input id="q" placeholder="Поиск по названию и меткам" value="'+esc(S.q)+'"></div><div class="chips" style="margin-top:10px">'+chips+'</div><div id="libList">'+libList()+'</div>';

 var q=S.q.toLowerCase();

 if(!items.length)return '<div class="sub" style="text-align:center;padding:24px 0">Ничего не найдено</div>';
 return items.map(function(x){return '<button class="item" data-act="item" data-id="'+x.id+'"><span class="grow"><span class="s">'+TYPE[x.type][0]+'</span><b>'+esc(x.title)+'</b><span class="s">'+x.sub+'</span></span>'+(S.fav[x.id]?'<span class="gold">'+ic('heart',18).replace('<svg','<svg style="fill:var(--gold)"')+'</span>':'')+'<span class="go">'+ic('cr')+'</span></button>'}).join('');
}

 return '<h1>Контент</h1><div class="grid2"><div class="paper"><h3 style="font-size:19px;margin-bottom:12px">Новая публикация</h3><div class="field"><label>Тип</label><select class="in"><option>Лекция + практика</option><option>Карточки + практика</option><option>Мини-лекция</option><option>Чек-лист</option><option>Гид</option><option>Рецепт и сочетание</option></select></div><div class="field"><label>Заголовок</label><input class="in"></div><div class="field"><label>Текст</label><textarea class="in"></textarea></div><div class="field"><label>Ссылка на видео</label><input class="in" placeholder="https://"></div><button class="primary center" data-act="saved">Опубликовать</button></div>'+
 '<div class="paper"><h3 style="font-size:19px;margin-bottom:12px">Новое событие</h3><div class="field"><label>Тип</label><select class="in"><option>Эфир</option><option>Публикация</option><option>Событие</option></select></div><div class="field"><label>Название</label><input class="in"></div><div class="row"><div class="field grow"><label>Дата</label><input class="in" type="date"></div><div class="field grow"><label>Время</label><input class="in" type="time"></div></div><div class="field"><label>Ссылка на эфир</label><input class="in" placeholder="https://"></div><label class="chk"><input type="checkbox" checked> Открывается страница события</label><button class="primary center" data-act="saved">Добавить в календарь</button></div></div>';
}
function admChat(){
 var f=[['Мария','Подскажите белое до 2 000 ₽?','Общий','нет'],['Гость77','Продам вино недорого, пишите в лс','Вино','реклама']];
 return '<h1>Модерация чата</h1><div class="dark scroll" style="padding:4px"><table class="t"><tr><th>Автор</th><th>Сообщение</th><th>Тема</th><th>Жалоба</th><th></th></tr>'+f.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+esc(x[1])+'</td><td>#'+x[2]+'</td><td>'+x[3]+'</td><td><div class="btnrow"><button class="primary danger sm" data-act="moddel">Удалить</button><button class="ghost sm" data-act="modban">Забанить</button></div></td></tr>'}).join('')+'</table></div><p class="soft small" style="margin-top:10px">Удаление и бан фиксируются в журнале. Модератор также видит кнопки удаления прямо в чате.</p>';
}
function admStaff(){
 return '<h1>Сотрудники</h1><div class="dark scroll" style="padding:4px"><table class="t"><tr><th>Сотрудник</th><th>Роль</th><th></th></tr>'+STAFF.map(function(s){return '<tr><td>'+s.name+'</td><td><select class="in" style="min-height:38px;padding:6px 10px"'+(s.role==='Владелец'?' disabled':'')+'>'+['Владелец','Техспец','Администратор','Модератор'].map(function(r){return '<option'+(r===s.role?' selected':'')+'>'+r+'</option>'}).join('')+'</select></td><td>'+(s.role==='Владелец'?'<span class="soft small">нельзя снять</span>':'<button class="ghost sm" data-act="demoted">Разжаловать</button>')+'</td></tr>'}).join('')+'</table></div>'+
 '<button class="primary sm" style="margin-top:14px" data-act="addstaff">Назначить сотрудника</button><p class="soft small" style="margin-top:10px">Назначать и разжаловать могут Техспец и Владелец. Роль Владельца снять нельзя.</p>';
}

/* ============ ВХОД / ОПЛАТА ============ */
function dots(n){return '<div class="stepdots">'+[1,2,3,4].map(function(i){return '<i class="'+(i<=n?'on':'')+'"></i>'}).join('')+'</div>'}
function mx(){return '<button class="x" data-act="mclose" aria-label="Закрыть">'+ic('x',17)+'</button>'}
function flowEmail(mode){
 S.join={mode:mode,tariff:S.tariff};
 openModal(mx()+'<h2>'+(mode==='login'?'Войти в приложение':'Присоединиться')+'</h2><p class="muted" style="margin-bottom:14px">Вход по email. Если ты здесь впервые, аккаунт создаётся после подтверждения адреса.</p>'+(mode==='join'?dots(1):'')+
 '<div class="field"><label>Твой email</label><input class="in" id="fEmail" type="email" placeholder="you@example.com" autocomplete="email"></div><button class="primary" data-act="f-email">Получить код'+ic('right',18)+'</button>');
}
function flowCode(){
 openModal(mx()+'<h2>Код из письма</h2><p class="muted" style="margin-bottom:14px">Мы отправили 6 цифр на '+esc(S.emailDemo)+'. Код действует 10 минут.</p>'+(S.join.mode==='join'?dots(2):'')+
 '<div class="field"><label>Код подтверждения</label><input class="in" id="fCode" inputmode="numeric" maxlength="6" placeholder="••••••" style="letter-spacing:.4em;font-size:22px;text-align:center"></div><p class="muted" style="margin-bottom:14px">Демо: подойдёт любой код из 6 цифр, например 123456.</p><button class="primary" data-act="f-code">Продолжить'+ic('right',18)+'</button>');
}
function flowConsent(){
 var t=tById(S.join.tariff);
 openModal(mx()+'<h2>Согласия</h2><p class="muted" style="margin-bottom:6px">Документы подписываются отдельно.</p>'+dots(3)+
 TARIFFS.map(function(x){return '<label class="topt '+(x.id===S.join.tariff?'on':'')+'"><input type="radio" name="tf" '+(x.id===S.join.tariff?'checked':'')+' data-act="tf" data-t="'+x.id+'"><span class="grow"><b>'+x.name+'</b><div class="soft small">'+perMonth(x)+' в месяц</div></span><b>'+rub(x.price)+'</b></label>'}).join('')+
 '<div style="height:10px"></div>'+
 '<label class="chk"><input type="checkbox" id="cPd"><span>Я согласен(на) на <span class="link" data-act="doc" data-d="cons">обработку персональных данных</span> и ознакомлен(а) с <span class="link" data-act="doc" data-d="pd">политикой</span> *</span></label>'+
 '<label class="chk"><input type="checkbox" id="cOffer"><span>Принимаю <span class="link" data-act="doc" data-d="offer">оферту</span> *</span></label>'+
 '<label class="chk"><input type="checkbox" id="cAuto" checked><span>Согласен(на) на автоматическое списание '+rub(t.price)+' каждые '+(t.months===1?'месяц':t.months===12?'12 месяцев':t.months+' мес.')+', отключить можно в профиле *</span></label>'+
 '<label class="chk"><input type="checkbox" id="cMkt"><span>Хочу получать <span class="link" data-act="doc" data-d="mkt">рекламные и информационные рассылки</span> (необязательно)</span></label>'+
 '<div id="fErr" class="small" style="color:var(--bad);min-height:20px;margin-bottom:6px"></div><button class="primary" data-act="f-consent">Перейти к оплате'+ic('right',18)+'</button>');
}
function flowPay(){
 var t=tById(S.join.tariff);
 openModal(mx()+'<h2>Оплата</h2>'+(S.join.mode==='join'?dots(4):'')+'<div class="kv"><span>Тариф</span><b>'+t.name+'</b></div><div class="kv"><span>К оплате</span><b>'+rub(t.price)+'</b></div>'+
 '<div class="banner" style="margin-top:14px">Здесь откроется страница платёжной системы. Данные карты вводятся там, приложение их не видит и не хранит.</div><button class="primary" data-act="f-pay">Оплатить '+rub(t.price)+' (демо)'+ic('right',18)+'</button>');
}
function flowDone(){
 openModal('<div style="text-align:center"><div style="color:var(--gold);margin:6px 0 12px">'+ic('wine',40)+'</div><h2 style="padding:0">Добро пожаловать в Академию</h2><p class="muted" style="margin:10px 0 18px">Оплата прошла, доступ открыт. Подключите бота, чтобы получать напоминания об эфирах и оплатах.</p></div>'+
 '<div class="stack"><button class="ghost" data-act="mess-join" data-m="tg">Подключить Telegram</button><button class="ghost" data-act="mess-join" data-m="max">Подключить MAX</button><button class="ghost" data-act="mess-join" data-m="vk">Подключить ВКонтакте</button><button class="primary center" data-act="enter">Войти в приложение</button></div>');
}

/* ============ ДЕЙСТВИЯ ============ */
document.addEventListener('click',function(ev){
 var a=ev.target.closest('[data-act]');if(!a)return;
 var d=a.dataset,act=d.act;
 if(act==='tf'){S.join.tariff=d.t;S.tariff=d.t;flowConsent();return}
 if(act==='rn'){S.tariff=d.t;S.join.tariff=d.t;document.querySelectorAll('#modalBox .topt').forEach(function(l){l.classList.toggle('on',l.querySelector('input').dataset.t===d.t)});return}
 if(act==='tq'){S.tq[+d.i]=d.v;document.querySelectorAll('input[name=tq'+d.i+']').forEach(function(r){r.closest('.opt').classList.toggle('on',r.dataset.v===d.v)});return}
 switch(act){
  case 'age':
   if(d.v==='1'){S.ageOk=true;S.under18=false;try{localStorage.setItem('age18','1')}catch(x){}}else{S.under18=true;S.ageOk=false}
   render();break;
  case 'reage':S.under18=false;S.ageOk=false;render();break;
  case 'scroll':var el=document.getElementById(d.t);el&&el.scrollIntoView({block:'start'});break;
  case 'ptariff':
   S.tariff=d.t;var t=tById(d.t);$('#kn-price').textContent=rub(t.price);$('#kn-pnote').textContent=perMonth(t)+' в месяц · цены демонстрационные, итоговые утвердит заказчик';
   document.querySelectorAll('.kn-periods button').forEach(function(b){b.classList.toggle('on',b.dataset.t===d.t)});break;
  case 'join':if(S.under18){toast('Вступление доступно только с 18 лет');return}flowEmail('join');break;
  case 'login':flowEmail('login');break;
  case 'mclose':closeModal();break;
  case 'f-email':
   var em=($('#fEmail').value||'').trim();if(!/^\S+@\S+\.\S+$/.test(em)){$('#fEmail').style.borderColor='#ff8c98';return}
   S.emailDemo=em;flowCode();break;
  case 'f-code':
   if(($('#fCode').value||'').length<6){$('#fCode').style.borderColor='#ff8c98';return}
   if(S.join.mode==='login'){closeModal();S.role='member';S.view='home';$('#roleSel').value='member';render();toast('С возвращением!')}else flowConsent();break;
  case 'f-consent':
   if(!($('#cPd').checked&&$('#cOffer').checked&&$('#cAuto').checked)){$('#fErr').textContent='Отметьте согласие на обработку данных, оферту и автосписание';return}
   S.mkt=$('#cMkt').checked;S.autopay=true;flowPay();break;
  case 'f-pay':
   if(S.join.mode==='renew'){closeModal();S.role='member';$('#roleSel').value='member';S.view='profile';render();toast('Подписка оформлена')}else flowDone();break;
  case 'enter':closeModal();S.role='member';S.view='home';$('#roleSel').value='member';render();break;
  case 'mess-join':S.mess[d.m]=true;toast('Откроется бот и привяжет аккаунт ('+({tg:'Telegram',max:'MAX',vk:'ВКонтакте'}[d.m])+')');break;
  case 'doc':openModal(mx()+'<h2>'+DOCS[d.d]+'</h2><p class="muted" style="margin:10px 0 18px">Здесь будет открываться утверждённый документ. Его текст и реквизиты пока не добавлены; тексты предоставляет заказчик (лучше проверить у юриста).</p><button class="primary center" data-act="mclose">Понятно</button>');break;
  case 'go':go(d.v);break;
  case 'day':S.day=+d.d;render();break;
  case 'weeknav':toast('Другие недели появятся по мере публикации программы');break;
  case 'bell':openModal(mx()+'<h2>Уведомления</h2><div style="margin-top:10px">'+NOTIFS.map(function(n){return '<div class="notif">'+n+'</div>'}).join('')+'</div>');break;
  case 'event':
   S.eid=+d.id;var evt=EVENTS.filter(function(x){return x.id===S.eid})[0];
   if(evt&&evt.go&&evt.go.view){go(evt.go.view)}else go('event');break;
  case 'final':S.eid=99;go('event');break;
  case 'remind':toast('Напомним, когда определим дату');break;
  case 'item':S.iid=+d.id;go('item');break;
  case 'fav':S.fav[+d.id]=!S.fav[+d.id];render();toast(S.fav[+d.id]?'Добавлено в избранное':'Убрано из избранного');break;
  case 'libtype':S.libType=d.t;render();break;
  case 'topic':S.topic=d.t;render();break;
  case 'send':
   var inp=$('#msgIn'),v=(inp.value||'').trim();if(!v)return;
   CHAT[S.topic].push({u:'Вы',me:1,t:v});render();setTimeout(function(){var i=$('#msgIn');i&&i.focus()},0);break;
  case 'del':S.chatDel[d.k]=1;render();toast('Сообщение удалено, запись в журнале');break;
  case 'tastedone':
   if(Object.keys(S.tq).length<TASTE_Q.length){toast('Ответьте на все три вопроса');return}
   S.taste=TASTE_Q.map(function(q,i){return S.tq[i]});render();toast('Карта вкуса сохранена, ответы переданы в Salebot');break;
  case 'retaste':S.taste=null;S.tq={};render();break;
  case 'autopay':if(S.role==='expired'){toast('Сначала возобновите подписку');return}S.autopay=!S.autopay;render();toast(S.autopay?'Автопродление включено':'Автопродление выключено. Доступ сохранится до конца срока');break;
  case 'mkt':S.mkt=!S.mkt;render();toast(S.mkt?'Согласие на рассылки подписано':'Согласие отозвано, статус передан в Salebot');break;
  case 'mess':S.mess[d.m]=!S.mess[d.m];render();toast(S.mess[d.m]?'Откроется бот для привязки аккаунта':'Мессенджер отключён');break;
  case 'renew':
   S.join={mode:'renew',tariff:S.tariff};
   openModal(mx()+'<h2>'+(S.role==='expired'?'Возобновить подписку':'Продлить или сменить тариф')+'</h2><p class="muted" style="margin-bottom:14px">Выберите срок.</p>'+TARIFFS.map(function(x){return '<label class="topt '+(x.id===S.tariff?'on':'')+'"><input type="radio" name="rn" '+(x.id===S.tariff?'checked':'')+' data-act="rn" data-t="'+x.id+'"><span class="grow"><b>'+x.name+'</b><div class="soft small">'+perMonth(x)+' в месяц</div></span><b>'+rub(x.price)+'</b></label>'}).join('')+'<button class="primary" style="margin-top:10px" data-act="f-pay-go">Перейти к оплате'+ic('right',18)+'</button>');break;
  case 'f-pay-go':flowPay();break;
  case 'newticket':
   var s=($('#tSubj').value||'').trim(),tx=($('#tText').value||'').trim();if(!s||!tx){toast('Заполните тему и сообщение');return}
   S.myTickets.unshift({id:200+S.myTickets.length,subj:s,st:'new',msgs:[['u',tx]]});render();toast('Обращение отправлено');break;
  case 'myticket':S.tid=+d.id;go('ticket');break;
  case 'watch':toast('Откроется внешняя площадка с трансляцией');break;
  case 'ics':toast('Событие добавлено в ваш календарь');break;
  case 'install':toast('В меню браузера: «Добавить на главный экран»');break;
  case 'logout':S.role='visitor';S.view='landing';$('#roleSel').value='visitor';render();break;
  case 'admin':go('admin');break;
  case 'tab':S.tab=d.t;S.openMember=null;render();break;
  case 'member':S.openMember=+d.id;render();break;
  case 'closem':S.openMember=null;render();break;
  case 'grant':toast('Доступ выдан, статус ушёл в Salebot');break;
  case 'close':toast('Доступ закрыт, статус ушёл в Salebot');break;
  case 'toggleauto':toast('Автосписание переключено');break;
  case 'extend':toast('Срок продлён вручную, запись в журнале');break;
  case 'refund':toast('Возврат оформлен через платёжную систему');break;
  case 'paylink':toast('Платёжная ссылка скопирована (действует 24 часа)');break;
  case 'bsend':
   var txt=($('#bText').value||'').trim();if(!txt){toast('Введите текст сообщения');return}
   S.sent.unshift({when:'сейчас',aud:$('#bAud').value,ch:'TG, MAX, ВК',n:256});render();toast('Рассылка передана в Salebot');break;
  case 'admticket':S.openTicket=+d.id;render();break;
  case 'reply':
   var r=($('#rText').value||'').trim();if(!r){toast('Введите ответ');return}
   var tk=TICKETS.filter(function(x){return x.id===S.openTicket})[0];tk.msgs.push(['s',r]);tk.st='work';render();toast('Ответ отправлен участнику');break;
  case 'solve':TICKETS.filter(function(x){return x.id===S.openTicket})[0].st='done';render();break;
  case 'saved':toast('Сохранено (в прототипе данные не записываются)');break;
  case 'moddel':toast('Сообщение удалено');break;
  case 'modban':toast('Пользователь заблокирован в чате');break;
  case 'demoted':toast('Роль снята, доступ в админку закрыт');break;
  case 'addstaff':toast('Откроется форма назначения: email и роль');break;
 }
});
document.addEventListener('input',function(e){if(e.target.id==='q'){S.q=e.target.value;$('#libList').innerHTML=libList()}});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;
 if(e.target.id==='msgIn'){e.preventDefault();var b=document.querySelector('[data-act=send]');b&&b.click()}
 if(e.target.id==='homeQ'){e.preventDefault();S.q=e.target.value;go('lib')}
});
$('#modal').addEventListener('click',function(e){if(e.target.id==='modal')closeModal()});

var sel=$('#roleSel');
sel.innerHTML=ROLES.map(function(r){return '<option value="'+r[0]+'">'+r[1]+'</option>'}).join('');
sel.addEventListener('change',function(){
 closeModal();S.role=sel.value;S.openMember=null;S.openTicket=null;
 S.view=S.role==='visitor'?'landing':isStaff()?'profile':'home';
 if(S.role==='visitor'){S.ageOk=false;S.under18=false;try{localStorage.removeItem('age18')}catch(x){}}
 render();window.scrollTo(0,0);
});
try{S.ageOk=localStorage.getItem('age18')==='1'}catch(x){}
render();
</script>
</body>
</html>
