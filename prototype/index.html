<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#350b19">
<meta name="robots" content="noindex,nofollow">
<title>Академия вкуса — прототип</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vitrina.css">
<style>
:root{
  --bg:#260e16; --panel:#321c25; --deep:#1c0910; --gold:#f2eee6; --white:#f2eee6; --soft:#cfc6c3; --line:rgba(242,238,230,.3);
  --ok:#7fcf94; --warn:#f0b35a; --bad:#ff8c98;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{min-height:100vh;font-family:AcademySans,Arial,sans-serif;font-size:14px;line-height:1.6;color:var(--white);background:#1d0510;padding-top:44px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;color:inherit}
a{color:var(--gold)}
h1,h2,h3{font-family:AcademySerif,Georgia,serif;font-weight:400}
.hide{display:none!important}
.soft{color:var(--soft)}
.gold{color:var(--gold)}
.small{font-size:12px}
.eyebrow{color:var(--gold);font-size:11px;line-height:1.6;letter-spacing:.12em;text-transform:uppercase}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* demo bar */
#demo{position:fixed;top:0;left:0;right:0;z-index:70;height:44px;display:flex;gap:10px;align-items:center;padding:0 12px;background:#14030a;border-bottom:1px solid var(--line);font-size:12px}
#demo b{color:var(--gold);letter-spacing:.14em;text-transform:uppercase;font-size:10.5px;white-space:nowrap}
#demo select{background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;flex:1;max-width:320px;min-width:0}

/* кнопки */
.primary{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;min-height:54px;padding:15px 20px;border:0;border-radius:12px;background:var(--gold);color:var(--deep);text-decoration:none;font:700 14px/1.6 AcademySans,Arial,sans-serif;text-align:left}
.primary.center{justify-content:center}
.primary.sm{min-height:44px;padding:10px 16px;width:auto;font-size:13px}
.primary[disabled]{opacity:.5;cursor:default}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;padding:12px 18px;border:1px solid var(--line);border-radius:12px;color:var(--white);font:600 13px/1.6 AcademySans;background:transparent}
.ghost.sm{min-height:40px;width:auto;padding:8px 14px;font-size:12px}
.danger{background:#a8323f!important;color:#fff!important}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid var(--line);color:var(--gold)}
.badge.live{border-color:var(--bad);color:var(--bad)}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.warn{border-color:var(--warn);color:var(--warn)}
.badge.bad{border-color:var(--bad);color:var(--bad)}
.stack>*+*{margin-top:14px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* поля */
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}
.field label{font-size:12px;color:var(--white)}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:13px 15px;min-height:48px;outline:none;color:var(--white);font-size:15px}
.in:focus{border-color:var(--gold)}
.in::placeholder{color:#b9a3ab}
textarea.in{min-height:96px;resize:vertical}
select.in option{color:#222}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.6;margin-bottom:12px;cursor:pointer;color:var(--soft)}
.chk input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:none}
.sw{position:relative;width:46px;height:26px;border-radius:999px;background:var(--line);flex:none;transition:.2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}
.sw.on::after{left:23px;background:var(--deep)}

/* карточки */
.paper{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;color:var(--white);position:relative}
.paper .muted,.muted{color:var(--soft)}
.dark{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--soft)}
.banner{border:1px solid var(--warn);border-radius:12px;padding:12px 14px;font-size:12.5px;background:rgba(240,179,90,.1);margin:6px 0 12px}

/* ============ ПРИЛОЖЕНИЕ ============ */
.app{padding:0 20px 110px}
.hdr{display:flex;justify-content:space-between;align-items:flex-start;padding:24px 0 6px}
.brand{font:400 31px/1.2 AcademySerif,serif;letter-spacing:-.02em}
.brand span{color:var(--gold)}
.by{font-size:12px;color:var(--soft);margin-top:2px}
.hbtns{display:flex;gap:10px}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold);background:rgba(71,18,35,.5);position:relative}
.iconbtn .dot{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--gold)}
.hello{font-size:12.5px;color:var(--soft);margin:8px 0 18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;height:128px;border-radius:16px;overflow:hidden;border:1px solid var(--line);text-align:left;background-color:var(--panel);background-repeat:no-repeat}
.tile::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,14,22,.25),rgba(28,9,16,.9))}
.tile .ic{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:9px;background:rgba(28,9,16,.75);border:1px solid var(--line);display:grid;place-items:center;color:var(--gold)}
.tile .ic svg{width:17px;height:17px}
.tile b{position:absolute;left:11px;right:8px;bottom:10px;font:600 13px/1.3 AcademySans}
.search{display:flex;align-items:center;gap:10px;margin:20px 0 6px;padding:0 16px;min-height:52px;border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--gold)}
.search input{flex:1;background:none;border:0;outline:none;color:var(--white);font-size:14px;min-width:0}
.search input::placeholder{color:#b9a3ab}
.sech{display:flex;justify-content:space-between;align-items:center;margin:30px 0 4px}
.sech h2{font-size:26px;letter-spacing:-.02em}
.sech .more{color:var(--gold);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.sech .more svg{width:15px;height:15px}
.arrows{display:flex;gap:14px;color:var(--gold)}
.sub{font-size:12px;color:var(--soft);margin-bottom:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.days button.on{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:700}
.days button i{width:4px;height:4px;border-radius:50%;background:transparent;display:block}
.days button.has i{background:var(--gold)}
.days button.on.has i{background:var(--deep)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin-bottom:10px}
.item b{font:600 14px/1.5 AcademySans;display:block}
.item span.s{font-size:12px;color:var(--soft);display:block}
.item .go{color:var(--gold)}
.item.nolink{opacity:.85;cursor:default}
.item .tm{font:400 17px AcademySerif,serif;color:var(--gold);min-width:50px}
.feature{position:relative;min-height:330px;border-radius:20px;overflow:hidden;border:1px solid var(--line);display:flex;align-items:flex-end;text-align:left;width:100%;background:var(--panel) url(img/v2/01-hero-kristina.jpg) no-repeat;background-size:230% auto;background-position:22% 6%}
.feature::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(38,14,22,.1) 0%,rgba(38,14,22,.55) 45%,rgba(28,9,16,.97) 100%)}
.feature .pill{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:rgba(28,9,16,.72);border:1px solid var(--line);font-size:12px;font-weight:500}
.feature .pill svg{width:15px;height:15px;color:var(--gold)}
.feature .in-f{position:relative;padding:22px 20px 20px;width:100%}
.feature h3{font:400 34px/1.15 AcademySerif,serif;letter-spacing:-.02em;margin:8px 0 18px}
.feature .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--soft)}
.feature .meta b{color:var(--gold);display:inline-flex;gap:6px;align-items:center;font-size:13px}
.lcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lcard{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);text-align:left}
.lcard .ph{height:128px;background-color:var(--deep);background-repeat:no-repeat;background-image:url(img/v2/01-hero-kristina.jpg)}
.lcard .tx{padding:14px 14px 16px}
.lcard .tx small{display:block;font-size:11px;color:var(--soft);margin-bottom:6px}
.lcard .tx b{font:400 17px/1.35 AcademySerif,serif}
.meet{border:1px solid var(--line);border-radius:18px;background:var(--panel);padding:20px}
.meet .eyebrow{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.meet h3{font:400 27px/1.25 AcademySerif,serif;margin-bottom:14px}
.meet p{font-size:12px;color:var(--soft);margin-bottom:16px}
.handy{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hbtn{display:flex;align-items:center;gap:12px;padding:18px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:13px;font-weight:500;text-align:left}
.hbtn svg{color:var(--gold)}
.nav{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:440px;bottom:0;z-index:40;background:var(--deep);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;padding:11px 2px 9px;font-size:10.5px;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:4px}
.nav button.on{color:var(--gold)}
.back{color:var(--gold);padding:14px 0 4px;font-size:13px;font-weight:600}
.pagehead{font-size:30px;letter-spacing:-.02em;margin:20px 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--soft)}
.chip.on{background:var(--gold);border-color:var(--gold);color:var(--deep);font-weight:700}
.dayh{font:400 17px AcademySerif,serif;margin:20px 0 10px;display:flex;gap:10px;align-items:center}
.dayh .today{font:700 10px AcademySans;letter-spacing:.1em;background:var(--gold);color:var(--deep);padding:3px 9px;border-radius:999px}
.video{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,#5a1830,#1d0510);border:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden}
.video .play{width:64px;height:64px;border-radius:50%;background:rgba(242,238,230,.15);border:1.5px solid var(--gold);display:grid;place-items:center;color:var(--gold)}
.video .cap{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--soft)}
.prose p{margin-bottom:12px;font-size:13.5px;line-height:1.85;color:var(--soft)}
.heart{display:inline-flex;align-items:center;gap:8px;color:var(--gold);font-size:12.5px;font-weight:600}
.heart.on svg{fill:var(--gold)}
.tag{display:inline-block;font-size:11.5px;color:var(--gold);margin-right:8px}
.msgs{display:flex;flex-direction:column;gap:10px;min-height:280px;padding:6px 0 10px}
.m{max-width:86%;padding:10px 13px;border-radius:14px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;position:relative;font-size:13.5px}
.m .who{font-size:11.5px;color:var(--gold);margin-bottom:2px;display:flex;gap:6px;align-items:center}
.m.me{align-self:flex-end;background:#6b1d3a}
.m .del{position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:#a8323f;font-size:12px;display:grid;place-items:center}
.m.gone{opacity:.5;font-style:italic}
.pin{font-size:12px;padding:10px 13px;border-radius:12px;border:1px dashed var(--gold);color:var(--gold);margin-bottom:8px}
.composer{position:sticky;bottom:64px;display:flex;gap:8px;padding:10px 0;background:linear-gradient(transparent,var(--bg) 30%)}
.composer .in{border-radius:999px}
.composer .primary{width:auto;min-height:48px;border-radius:999px;padding:0 20px}
.mrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:11px;border:1px solid var(--line);color:var(--gold);flex:none}
h2.sec{font-size:22px;margin:28px 0 12px}
.q{margin-bottom:18px}
.q h3{font:400 19px/1.35 AcademySerif,serif;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--panel);font-size:13px}
.opt input{accent-color:var(--gold)}
.opt.on{border-color:var(--gold)}
.steps{display:grid;gap:14px}
.steps>div{display:flex;gap:14px}
.steps>div>b{font:400 24px AcademySerif,serif;color:var(--gold);min-width:34px}

/* модальные окна */
#modal{position:fixed;inset:0;z-index:80;background:rgba(10,2,6,.78);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:24px 22px 30px;animation:up .25s ease}
@media(min-width:640px){#modal{align-items:center}#modal .box{border-radius:20px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
#modal .x{float:right;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;color:var(--white);background:var(--bg)}
#modal h2{font-size:25px;margin-bottom:8px;letter-spacing:-.02em;padding-right:50px}
#modal .muted{color:var(--soft);font-size:12.5px;line-height:1.8}
.topt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--bg);font-size:13px}
.topt.on{border-color:var(--gold)}
.topt input{accent-color:var(--gold)}
.stepdots{display:flex;gap:6px;margin:12px 0 16px}
.stepdots i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.stepdots i.on{background:var(--gold)}
.notif{padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}
.notif:last-of-type{border-bottom:0}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:90;background:var(--deep);border:1px solid var(--gold);color:var(--white);padding:11px 18px;border-radius:999px;font-size:12.5px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.on{opacity:1}
#age{position:fixed;inset:0;z-index:95;background:rgba(20,3,10,.6);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;text-align:center}
#age .box{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--gold);border-radius:20px;padding:28px 22px;animation:up .25s ease}
#age h2{font-size:28px;margin:14px 0 10px;letter-spacing:-.02em}
#age .seal{width:72px;height:72px;margin:0 auto;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;font:400 26px AcademySerif,serif;color:var(--gold)}
#age p{font-size:12.5px;color:var(--soft);margin-bottom:22px;line-height:1.8}

/* ============ АДМИНКА (схема «Шпаргалки»: сайдбар, на телефоне — узкий бар слева) ============ */
.ash{display:flex;min-height:calc(100vh - 44px);background:var(--bg)}
.side{position:sticky;top:44px;height:calc(100vh - 44px);width:256px;flex:none;display:flex;flex-direction:column;overflow-y:auto;padding:20px 14px;background:linear-gradient(180deg,#2b0a16 0%,#1d0510 100%);border-right:1px solid var(--line)}
.brand-a{padding:0 8px 18px}
.eb{display:block;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.brand-a b,.rail-head b{font:400 19px/1.2 AcademySerif,serif;color:#fff;display:block}
.gt{padding:6px 10px 4px;font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.sep{height:1px;background:rgba(255,255,255,.1);margin:10px 0}
.nl{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500;color:rgba(255,255,255,.8);text-align:left}
.nl:hover{background:rgba(255,255,255,.07);color:#fff}
.nl.on{background:rgba(255,255,255,.09);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
.nl .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ni{position:relative;flex:none;display:grid;place-items:center}
.cnt{font-style:normal;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--gold);color:var(--deep);font-size:10.5px;font-weight:700;display:grid;place-items:center}
.dotb{position:absolute;top:-3px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #1d0510}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.suser{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.1)}
.suser .u{display:flex;gap:10px;align-items:center}
.av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.suser .nm{font-size:12.5px;font-weight:600;line-height:1.3}
.suser .rl{font-size:11px;color:rgba(255,255,255,.5)}
.suser .btns{display:flex;gap:8px;margin-top:12px}
.suser .btns button{flex:1;height:34px;border:1px solid var(--line);border-radius:9px;font-size:12px;color:var(--soft)}
.amain{flex:1;min-width:0}
.topbar{position:sticky;top:44px;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 20px;background:rgba(38,14,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;min-width:0}
.crumb span{color:var(--soft)}
.crumb b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.apage{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
.aph{display:flex;flex-wrap:wrap;gap:12px 16px;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.aph .ico{width:38px;height:38px;border-radius:11px;background:rgba(242,238,230,.12);color:var(--gold);display:grid;place-items:center;flex:none}
.aph h1{font:400 28px/1.2 AcademySerif,serif;letter-spacing:-.02em}
.aph p{font-size:13px;color:var(--soft);margin-top:8px;max-width:62ch}
.rail,.rail-dim{display:none}

table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:500;color:var(--soft);font-size:11.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:rgba(255,255,255,.04)}
.scroll{overflow-x:auto}
.cards-m{display:none}
.dcard{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.dcard .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dcard .l2{font-size:12px;color:var(--soft);margin-top:6px}

/* Каждое действие с галочкой пишется в журнал: документ, редакция, время, согласие или отзыв, где совершено.
   В боевой версии это таблица consents в базе (user_id, document, edition, granted, at, source, ip, user_agent). */
var CONS_LABEL={cons:'Обработка ПД',pd:'Политика',offer:'Оферта',mkt:'Рассылки',auto:'Автосписание'};
function fmtTs(iso){var t=new Date(Date.parse(iso)+3*3600e3).toISOString();return t.slice(8,10)+'.'+t.slice(5,7)+'.'+t.slice(0,4)+' '+t.slice(11,16)}
function lastConsent(doc){var r=S.consents.filter(function(c){return c.doc===doc});return r[r.length-1]}
function logConsent(doc,granted,how){
 var l=lastConsent(doc);if(l&&!!l.granted===!!granted)return;
 S.consents.push({doc:doc,ed:DOC_TEXT[doc]?DOC_TEXT[doc].ed:'',at:new Date().toISOString(),granted:!!granted,how:how});saveState();
}
function consRow(doc,label,def){var c=lastConsent(doc);return '<div class="kv"><span class="link" data-act="doc" data-d="'+doc+'">'+label+'</span><b class="small" style="text-align:right">'+(c?(c.granted?'подписано ':'отозвано ')+fmtTs(c.at):def)+'</b></div>'}
function consJournal(m){
 var d0=m.pay&&m.pay.length?m.pay[0][0]:'—',ed='ред. 18.09.2026';
 var rows='<div class="kv"><span>Обработка ПД</span><b class="small">подписано '+d0+' · '+ed+'</b></div><div class="kv"><span>Политика</span><b class="small">ознакомлен(а) '+d0+' · '+ed+'</b></div><div class="kv"><span>Оферта</span><b class="small">подписана '+d0+'</b></div>'+
  (m.autopay?'<div class="kv"><span>Автосписание</span><b class="small">подписано '+d0+'</b></div>':'')+
  '<div class="kv"><span>Рассылки</span><b class="small" style="text-align:right">'+(m.mkt?'подписано '+m.mkt+' · '+ed:'не подписано · рассылки не шлём')+'</b></div>';
 if(m.id===1&&S.consents.length)rows+='<div class="sub" style="margin:12px 0 4px">Новые записи журнала (из этого прототипа)</div>'+S.consents.map(function(c){return '<div class="kv"><span>'+CONS_LABEL[c.doc]+(c.ed?' · ред. '+c.ed:'')+'</span><b class="small" style="text-align:right">'+(c.granted?'согласие':'отзыв')+' · '+fmtTs(c.at)+'<br><span class="soft">'+c.how+'</span></b></div>'}).join('');
 return rows;
}
function docBody(key){
 var D=DOC_TEXT[key];
 if(!D)return '<h1>'+DOCS[key]+'</h1><div class="paper" style="margin-top:18px"><p class="muted">Документ готовится юристом. Как только текст будет утверждён, он появится на этой странице, а галочка согласия в окне оформления начнёт записываться в журнал вместе с номером редакции.</p></div>';
 var t=D.title.split(' ');var head=t[0].charAt(0)+t[0].slice(1).toLowerCase(),rest=t.slice(1).join(' ');
 var out='<div class="eyebrow">Академия вкуса</div><h1>'+head+'</h1><p style="margin-top:8px">'+esc(rest)+'</p><div class="sub" style="margin:8px 0 18px">Редакция от '+D.ed+'</div>';
 var ul=false;
 D.blocks.forEach(function(b){
  if(b[0]==='li'){if(!ul){out+='<ul>';ul=true}out+='<li>'+esc(b[1])+'</li>';return}
  if(ul){out+='</ul>';ul=false}
  out+=b[0]==='h'?'<h2>'+esc(b[1])+'</h2>':'<p>'+esc(b[1])+'</p>';
 });
 if(ul)out+='</ul>';
 var c=lastConsent(key);
 if(c)out+='<div class="paper small" style="margin-top:22px">Ваше действие: '+(c.granted?'согласие подписано ':'согласие отозвано ')+fmtTs(c.at)+', редакция от '+c.ed+'.</div>';
 return out;
}

function fmtLeft(){var s=Math.max(0,Math.round((S.order.expiresAt-Date.now())/1000));return ('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function stopTimer(){if(S.timerId){clearInterval(S.timerId);S.timerId=null}}
function startTimer(){
 stopTimer();
 S.timerId=setInterval(function(){
  var el=$('#orderTimer');if(!el){stopTimer();return}
  var left=S.order.expiresAt-Date.now();
  if(left<=0){stopTimer();flowExpired();return}
  el.textContent=fmtLeft();el.classList.toggle('low',left<5*60000);
 },1000);
}
